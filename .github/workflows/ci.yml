# Fast feedback only. AGENTS.md requires the full local suite and packaging
# check before opening or updating a PR. No native Bevy compilation, software
# render review, backend installation or model download runs in this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path demos/relay-runner/Cargo.toml -- --check

  python:
    name: Python and asset metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet './python[dev]'
      # Native-CLI and optional-image tests can skip here; the complete local
      # run is mandatory and its actual results belong in the PR description.
      - run: python3 -m pytest -q
        working-directory: python
      - run: python3 demos/relay-runner/web/package.py --check
