# The pass/fail half of `just ci`, run on every push and pull request.
#
# Four jobs, one question each, so a failure names itself: formatting,
# clippy with warnings as errors, the test suite, and the headless gate. The
# toolchain comes from rust-toolchain.toml — the pin lives in one place, and
# each job reads it from the file rather than repeating it here.
#
# The headless job renders with no display server on mesa's lavapipe
# (mesa-vulkan-drivers + libvulkan1, WGPU_BACKEND=vulkan, DISPLAY unset):
# the capture smoke, a contact sheet of every shipped clip (non-zero on one
# that binds to nothing or never moves), `forge views` on the committed test
# fixture — the unit cube TRELLIS made from a test image, culling off — and
# then the gates on the committed library: audit (by bytes and by pose, on
# the fixture mannequin), check-bodies (the rig profile held against every
# shipped body), manifest --check, verify. The test job also runs
# `just ci-fake`: the four generate pipelines on FORGE_FAKE=1 placeholders
# in a throwaway project — python3 is on the runner, no backend is
# installed, no Blender, no GPU. Nothing here needs a secret, and no model
# is fetched.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bevy's audio and input backends link against ALSA and libudev even in
      # a windowless build; without the headers the workspace does not compile.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: cargo test --workspace
      # The Python layer's own tests (stdlib only, no backend) and the fake
      # pipelines end to end: mesh→prop→model, mesh→rig→export→body,
      # sweep→review→clip, sfx→audio, then audit, manifest --check, verify
      # in the throwaway project.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet "pytest>=8"
      - run: python3 -m pytest -q
        working-directory: python
      - run: just ci-fake

  headless:
    name: headless
    runs-on: ubuntu-latest
    # Proven locally under `env -u DISPLAY -u WAYLAND_DISPLAY` on llvmpipe;
    # not yet seen green on a GitHub runner. Left as a hard failure on
    # purpose: a smoke that is allowed to fail is a smoke nobody reads, and
    # the first red run is the one that tells us what the runner lacks.
    continue-on-error: false
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      # lavapipe is the software Vulkan adapter; libvulkan1 is the loader
      # that finds it. The rest is what every job needs to link Bevy.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers libvulkan1
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      # No display: the smoke recipe itself unsets DISPLAY and WAYLAND_DISPLAY,
      # and a runner has neither to begin with. The renders after it find the
      # same adapter the smoke did.
      - run: just smoke
      # Every shipped clip as a sheet on the stage body; an empty library
      # renders nothing and passes.
      - run: just sheets
      # The seven views of a raw lift, the way `forge-character` looks at one
      # before the rig: a path under out/ gets culling off by default, so the
      # fixture is copied there first.
      - run: mkdir -p out/lifts && cp crates/forge_studio/tests/fixtures/testbox.glb out/lifts/testbox.glb && target/debug/forge views out/lifts/testbox.glb
      - run: just check-bodies
      - run: just audit manifest-check verify
