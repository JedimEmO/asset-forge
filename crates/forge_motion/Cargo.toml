[package]
name = "forge_motion"
description = "Motion takes as data: read an ARDY .npz, apply the edit knobs, derive footsteps, and bake the result into a .glb clip on a rig — no engine, no Blender"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gamedev", "animation", "gltf", "motion", "npz"]
categories = ["game-development", "rendering::data-formats", "encoding"]

[dependencies]
# .npy members inside a .npz are stored uncompressed, so this is only used to
# find them; no inflate path is exercised.
zip = { workspace = true }
glam = { workspace = true }
# Reader and writer for the glTF container. Default features stay off: a
# baked clip carries a three-vertex anchor triangle and no images, and the
# rig file it reads rest transforms from carries none this crate decodes.
gltf = { workspace = true }
# The bundle merge only. Everything else here speaks glTF through the typed
# `gltf-json` document, but a merge has to hand a body's document back
# unchanged apart from what it appended — materials, textures and any
# extension this crate does not model — and a typed round trip drops what it
# does not know. So the merge edits the JSON chunk as generic JSON. The bake
# still never sees json: it takes already-parsed types.
serde_json = { workspace = true }

[lints]
workspace = true
