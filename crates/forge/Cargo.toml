[package]
name = "forge"
description = "The one command line over the library crates: init, catalog, the four promote doors, the manifest and every engine-free check — the studio and the MCP server join it as subcommands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The binary is the toolkit's front door, not a library anyone depends on.
publish = false

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# Everything the commands do lives in the library crates; this binary is the
# flag table, the project lookup and the exit code. No logic of its own means
# the MCP server and the studio cannot disagree with it.
forge_library = { workspace = true }
forge_audio = { workspace = true }
forge_rig = { workspace = true }
# The studio brings Bevy with it — minutes to build, and the reason the
# logic stays in the library crates: `cargo test -p forge_library` never
# pays for a renderer. Every eye-render (sheet, views, turntable), the
# window, the rig check, the bones report and the posed half of audit come
# through it.
forge_studio = { workspace = true }
# The MCP server, as a library: a `Config` and a `serve`. Every rmcp type
# stays behind that door, so the SDK's pin is forge_mcp's problem alone.
forge_mcp = { workspace = true }
# The queue every generate goes through, and the daemon `forge serve` runs.
# The binary composes it with forge_mcp: forge_mcp depends on forge_serve
# and not the other way round, which is the only direction with no cycle.
forge_serve = { workspace = true }
# The daemon's router, nested with the MCP service at /mcp.
axum = { workspace = true }
# The runtime `serve` is awaited on. Multi-threaded because a tool that
# blocks on a bake must not stop the server answering the next frame.
tokio = { workspace = true }
# The one line the Python layer speaks back — `forge gen`'s last stdout line,
# `forge gen doctor --json`'s report — is JSON; nothing else here parses any.
serde_json = { workspace = true }
# Bevy loads nothing from outside an asset root, so a body that is not in
# the library — the fixture mannequin, an export under out/ — is staged
# beside its clip in a scratch root that removes itself.
tempfile = { workspace = true }

[lints]
workspace = true
