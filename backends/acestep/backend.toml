# ACE-Step 1.5 — prompt (and lyrics) to a music track. `forge gen music`.
#
# It runs **on the ComfyUI host**, not in an environment of its own: ACE-Step
# 1.5 is native to the pinned ComfyUI (v0.34.2 has `EmptyAceStep1.5LatentAudio`,
# `TextEncodeAceStepAudio1.5` and `VAEDecodeAudio` with no custom node), so
# this directory holds a tracked graph and the description of what the host
# needs to run it — no venv, no clone, no `.env`, no resident server of its
# own to start and stop. `forge gen music` loads `workflows/music.api.json`,
# patches the knobs the run states into it, posts it to 127.0.0.1:8188 and
# fetches what came out.
#
# `unload_node` is null on purpose: these are native nodes and ComfyUI's own
# memory manager gives the card back by itself — a 30 s track went 22.8 →
# 22.6 GB free with no intervention, the model gone before the job's row was
# written (measured 2026-08-30). That is the opposite of the two MOSS
# backends, whose wrapper pack `POST /free` does not touch.
#
# Install traps, dated: designs/hosting.md, "ComfyUI".

name = "acestep"
role = "music"
executor = "comfy"
host = "comfy"                             # which backends/<name> is the service
upstream = "https://github.com/ACE-Step/ACE-Step-1.5.git"
# No `commit`: there is no checkout of this repository any more. What ran is
# the host's ComfyUI at its own commit, and every record says so under
# `backend.comfyui_commit`; writing a second commit here under the
# generator's name would be one fact in two places.
license = "Apache-2.0 (ACE-Step 1.5 weights, as redistributed by Comfy-Org); the code that runs them is ComfyUI's"
# Measured, with the budget above it: a 30 s track at 96 bpm peaked at
# 13.1 GB (nvidia-smi at 10 Hz, 2026-08-30; designs/hosting.md, "the first
# real run of the audio path"), and the 12 that stood here read 1 GB light —
# a budget under its own peak lets the blocked-rather-than-OOM gate admit a
# job that OOMs. Nothing is resident afterwards: native ACE-Step gives the
# card back with no intervention at all.
vram_gb = 14
entry = "audio.music"

[comfy]
workflows = ["music.api.json"]
# Captured from the running host's GET /object_info on 2026-08-30, never
# written from memory. Every one is native to ComfyUI v0.34.2.
nodes = [
    "CheckpointLoaderSimple",
    "ModelSamplingAuraFlow",
    "TextEncodeAceStepAudio1.5",
    "ConditioningZeroOut",
    "EmptyAceStep1.5LatentAudio",
    "KSampler",
    "VAEDecodeAudio",
    "SaveAudio",
]
# No `unload_node`: TOML cannot say null, and absent is the same claim —
# these are native models, ComfyUI's own memory manager owns them, and
# POST /free gives the card back. A wrapper pack is what needs one.

# One file: ComfyUI's own `audio_ace_step_1_5_checkpoint` template loads the
# turbo model, both text encoders and the VAE out of a single checkpoint,
# which is 10.03 GB against 19.9 GB for the split form and the same model.
[[models]]
id = "Comfy-Org/ace_step_1.5_ComfyUI_files"
store = "comfy:models/checkpoints"
file = "checkpoints/ace_step_1.5_turbo_aio.safetensors"
license = "Apache-2.0"
gb = 10.03
note = "ACE-Step 1.5 turbo, all in one file (DiT + qwen_0.6b/qwen_4b text encoders + the 1.5 VAE); the size is the hub's, read 2026-08-30"

[[notices]]
title = "ffmpeg"
text = "ComfyUI v0.34.2 saves audio as flac, mp3 or opus and has no WAV save node, so `forge gen music` fetches the flac and transcodes it with ffmpeg — losslessly for --format wav, to vorbis for --format ogg. ffmpeg is required for both, where the old server path needed it only for ogg."

[[notices]]
title = "the card"
text = "a track is alone on the card like every other generate. The host holds the model until the next POST /free (which the lease holder does around the job) or until `systemctl --user stop forge-comfy`; there is no resident ACE-Step server any more, and no --stop-server."
