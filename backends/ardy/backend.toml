# ARDY — prompt → motion take. `forge gen motion sweep|keys` run under this
# env; `forge gen motion review` runs under it too (numpy + matplotlib, no
# GPU). Read by python/forge_gen/backends.py; the launcher exports [env]
# with ${PREFIX}, ${CHECKOUT}, ${BACKEND_DIR}, ${TEXT_ENCODERS} and
# ${CHECKPOINTS} expanded, as defaults (a value you exported yourself wins).
# Install traps live in designs/hosting.md under "ARDY".

name = "ardy"
role = "motion"
upstream = "https://github.com/nv-tlabs/ardy"
commit = "693f74d13b3d04a0a22ce127ee79c929dd89756b"
license = "Apache-2.0 code; NVIDIA Open Model License weights; text encoder: Llama 3 Community License"
env_kind = "venv"
python = "3.12"
cuda = "13.0"                      # what the PyPI torch wheel the installer resolves carries (2.13.0+cu130 on the reference machine)
vram_gb = 16                       # one sweep; the 8B text encoder is most of it. Never beside TRELLIS, MOSS or the ACE-Step server.
entry = "motion"                   # forge_gen.motion.{sweep,keys,review}; each inner module is run by name
cwd = "checkout"                   # ardy is imported from the clone (pip install -e); its assets/ are relative to it
resident = false

[env]
# ${TEXT_ENCODERS} is the launcher's expansion of backends/ardy/.text-encoders
# (the symlink install.sh wrote, resolved to its real path). ARDY joins its
# two encoder names onto this directory: <dir>/McGill-NLP/LLM2Vec-Meta-Llama-
# 3-8B-Instruct-mntp (the merged base) and <dir>/McGill-NLP/...-mntp-supervised
# (the PEFT adapter). assemble_text_encoder.py lays the directory out.
TEXT_ENCODERS_DIR = "${TEXT_ENCODERS}"
# Resolve the released model from the local HF cache before going online.
LOCAL_CACHE = "true"
# Load the LLM2Vec encoder in-process instead of probing the optional
# text-encoder service on 127.0.0.1:9550 first (the fallback is the same).
TEXT_ENCODER_MODE = "local"

[[models]]
id = "nvidia/ARDY-Core-RP-20FPS-Horizon40"
store = "hf"
license = "NVIDIA Open Model License"
note = "the `core` model: cskel27 at 20 fps, 40-frame horizon"

[[models]]
id = "NousResearch/Meta-Llama-3-8B-Instruct"
store = "text_encoders_dir"
license = "Llama 3 Community License"
note = "the text encoder's base weights (an ungated mirror of meta-llama/Meta-Llama-3-8B-Instruct); kept so the merge below can be redone"

[[models]]
id = "McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp"
store = "text_encoders_dir"
license = "MIT adapter merged into Llama 3 Community License weights"
note = "the base with the LLM2Vec MNTP adapter merged in — a full model, written by assemble_text_encoder.py"

[[models]]
id = "McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp-supervised"
store = "text_encoders_dir"
license = "MIT"
note = "the supervised PEFT adapter applied on top of the merged model at load time"

[[notices]]
title = "Llama 3"
text = "Built with Meta Llama 3 — the text encoder only; it conditions generation and never ships in an asset"
