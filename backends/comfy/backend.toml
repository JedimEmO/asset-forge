# ComfyUI — the host the "comfy" executor drives over HTTP. Not a generator:
# it runs no forge module, holds no weights of its own and is not execed by
# the launcher. `forge serve`'s comfy executor (Phase 1) posts a workflow to
# 127.0.0.1:8188 and reads the result back; until then this directory exists
# so `forge doctor` lists the host beside the generators, with its pin, its
# licence and the models the reference spike fetched into it.
#
# Described like Blender — a host program, env_kind "none", probed from the
# outside — with one difference: ComfyUI *is* a pinned checkout, so `commit`
# names it and probe.py holds the running service to it. The venv, the clone
# and the models live under $PREFIX (${FORGE_BACKENDS_HOME:-~/.cache/
# asset-forge/backends}/comfy); this directory holds the .env and .checkout
# links, the unit file, the paths config and the Manager snapshot.
#
# Install traps, dated: designs/hosting.md, "ComfyUI".

name = "comfy"
role = "host"                              # not "tool": Blender is a binary a module execs; this is a service a client calls
executor = "tool"                          # forge2.md's second-form field; today's parser keeps it in `extra`
upstream = "https://github.com/comfyanonymous/ComfyUI"
commit = "169fcf35a2fc163fec31338b816503ddac0d3fcf"   # v0.34.2, 2026-08-27
license = "GPL-3.0-or-later (ComfyUI; driven over HTTP from a separate process, so nothing of it is linked into the toolkit)"
env_kind = "none"                          # doctor probes the service, not an interpreter; .env still points at the venv the unit runs
python = "3.12"                            # the venv the systemd unit execs
cuda = "13.0"                              # torch 2.13.0+cu130 in that venv
vram_gb = 0.4                              # what the idle service holds (CUDA context); the models it hosts carry their own numbers
entry = "forge_gen.comfy"                  # where Phase 1's HTTP client will live; nothing execs a host backend's entry
cwd = "none"
resident = true                            # a systemd --user unit: up across calls, unlike every other backend

[env]
PYTHONNOUSERSITE = "1"
# Every node pack that downloads from the hub reuses the cache the other
# backends already filled; the unit sets the same value.
HF_HOME = "${HOME}/.cache/huggingface"

[server]
host = "127.0.0.1"
port = 8188
health = "/system_stats"
unit = "forge-comfy.service"               # systemctl --user; probe.py names it in its hints
ready_timeout_s = 120

[comfy]
# The Manager is a pip package now, not a clone: ComfyUI pins it in
# manager_requirements.txt and `--enable-manager` turns it on.
manager_package = "comfyui_manager"
manager_version = "4.2.2"
frontend = "1.49.6"                        # comfyui-frontend-package, pinned by requirements.txt
snapshot = "snapshot.json"                 # `GET /api/manager/snapshot/get_current`, committed beside this file
base_directory = "data"                    # relative to $PREFIX: models/, input/, output/, user/, custom_nodes/
# Two custom node packs. Everything the fp8 image templates and ACE-Step 1.5
# need is native to v0.34.2; the lean tier's Q4_K_M GGUF needs ComfyUI-GGUF,
# and the three MOSS models come through TTS-Audio-Suite. Each entry is
# { repo, commit, dir, pips, nodes }: `dir` is the directory name under
# $PREFIX/data/custom_nodes/, `pips` what the pack needs in the comfy venv
# beyond ComfyUI's own requirements. A pack lives in four places or nowhere
# — here, in install.sh (cloned at its pin *before* the unit starts, because
# packs are scanned once at startup), in snapshot.json (re-fetched from the
# Manager, never hand-edited) and in hosting.md's pins row.
[[comfy.packs]]
repo = "https://github.com/city96/ComfyUI-GGUF"
commit = "6ea2651e7df66d7585f6ffee804b20e92fb38b8a"   # 2026-01-12
dir = "ComfyUI-GGUF"
license = "Apache-2.0"
pips = ["gguf==0.19.0", "protobuf==7.36.0"]
nodes = ["UnetLoaderGGUF"]
note = "loads qwen-image-Q4_K_M.gguf for reference_qwen_gguf.api.json — the lean tier's image model. The fp8 templates do not touch it."

[[comfy.packs]]
repo = "https://github.com/diodiogod/TTS-Audio-Suite"
commit = "fab00263fbdcdaddd4c721d1b560e1a08b6025ea"   # v5.8.7, 2026-08-28
dir = "TTS-Audio-Suite"
license = "MIT"
# Empty, and measured so: its requirements.txt asks for numpy<2.3.0, which
# would downgrade the host's 2.5.2 under every image template — and no pip
# was needed. Each node registers behind its own try/except, so all 58
# registered on the first restart with torch 2.13.0, torchaudio 2.11.0 and
# numpy 2.5.2 exactly as they were (2026-08-30). The Manager's
# allow_pip_install is False, which is why adding the clone could not run
# the pack's install.py behind anyone's back.
pips = []
# The six the three audio templates use, of the 58 it registers.
nodes = [
    "MossSoundEffectV2EngineNode",
    "UnifiedSoundEffectsNode",
    "MossTTSEngineNode",
    "UnifiedTTSTextNode",
    "UnifiedVoiceDesignerNode",
    "CharacterVoicesNode",
]
note = "the three MOSS models — SoundEffect v2, TTS and VoiceGenerator — behind moss_sfx and moss_tts. It registers no unload node at this pin, so POST /free is the only lever the card has."

# The models the host holds, in the ComfyUI folder each lives in under
# $PREFIX/<base_directory>/models/. `store = "comfy:models/<dir>"` is what
# says so — one model list, the same one doctor, install.sh and probe.py
# read, rather than a [[comfy.models]] block beside it that could disagree.

[[models]]
id = "Comfy-Org/Qwen-Image_ComfyUI"
store = "comfy:models/diffusion_models"
file = "split_files/diffusion_models/qwen_image_fp8_e4m3fn.safetensors"
license = "Apache-2.0"
gb = 20.43

[[models]]
id = "Comfy-Org/Qwen-Image_ComfyUI"
store = "comfy:models/text_encoders"
file = "split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors"
license = "Apache-2.0"
gb = 9.38

[[models]]
id = "Comfy-Org/Qwen-Image_ComfyUI"
store = "comfy:models/vae"
file = "split_files/vae/qwen_image_vae.safetensors"
license = "Apache-2.0"
gb = 0.25

[[models]]
id = "city96/Qwen-Image-gguf"
store = "comfy:models/diffusion_models"
file = "qwen-image-Q4_K_M.gguf"
revision = "e77babc55af111419e1714a7a0a848b9cac25db7"
license = "Apache-2.0"
gb = 13.07
node = "UnetLoaderGGUF"
field = "unet_name"
note = "the lean tier's Qwen-Image: 16.2 GB measured at 1024 with --reserve-vram 8, against fp8's 23.3 GB, and 111 s against 113 s. Needs the ComfyUI-GGUF pack above; the text encoder stays the fp8 Qwen2.5-VL"

[[models]]
id = "Comfy-Org/Qwen-Image-InstantX-ControlNets"
store = "comfy:models/controlnet"
file = "split_files/controlnet/Qwen-Image-InstantX-ControlNet-Union.safetensors"
license = "Apache-2.0"
gb = 3.54
note = "InstantX Qwen-Image ControlNet-Union: canny, depth, pose, soft edge — native ControlNetLoader, no custom node"

[[models]]
id = "Comfy-Org/flux1-schnell"
store = "comfy:models/checkpoints"
file = "flux1-schnell-fp8.safetensors"
license = "Apache-2.0"
gb = 17.24
note = "the fp8 form ComfyUI documents for schnell is the all-in-one checkpoint (CheckpointLoaderSimple); there is no fp8 UNET-only file, only a 23.8 GB bf16 one"

[[models]]
id = "comfyanonymous/flux_text_encoders"
store = "comfy:models/text_encoders"
file = "clip_l.safetensors"
license = "Apache-2.0"
gb = 0.25

[[models]]
id = "comfyanonymous/flux_text_encoders"
store = "comfy:models/text_encoders"
file = "t5xxl_fp8_e4m3fn.safetensors"
license = "Apache-2.0"
gb = 4.89

[[models]]
id = "black-forest-labs/FLUX.1-schnell"
store = "comfy:models/vae"
file = "ae.safetensors"
license = "Apache-2.0"
gb = 0.34
note = "gated: auto — an HF token is required even though the licence is Apache-2.0"

[[models]]
id = "Shakker-Labs/FLUX.1-dev-ControlNet-Union-Pro-2.0"
store = "comfy:models/controlnet"
file = "diffusion_pytorch_model.safetensors"
local = "FLUX.1-dev-ControlNet-Union-Pro-2.0.safetensors"
license = "FLUX.1-dev Non-Commercial License"
gb = 4.28
note = "the only maintained pose ControlNet for the FLUX family; trained on FLUX.1-dev, applied to schnell off-base. Both facts are the spike's to weigh"

[[notices]]
title = "ComfyUI"
text = "GPL-3.0-or-later. It runs as its own systemd --user service and is driven over HTTP; nothing of it is imported into the toolkit, and what it writes is the project's own. Started with --disable-api-nodes, so no node in it can call a paid API or reach the internet from the graph."

[[notices]]
title = "FLUX pose ControlNet"
text = "Shakker-Labs/FLUX.1-dev-ControlNet-Union-Pro-2.0 is under the FLUX.1-dev Non-Commercial License and was trained on FLUX.1-dev, not schnell. It is here only so the Phase 0 spike can condition both candidates on a pose; no reference record may name it until that licence is weighed. The Qwen-Image side (InstantX ControlNet-Union) is Apache-2.0 and on-base."

[[notices]]
title = "resident service"
text = "the unit is up across calls and holds ~0.4 GB of the card for its CUDA context even with no model loaded; a loaded image model stays resident until the workflow's unload node or POST /free. Stop it (systemctl --user stop forge-comfy) before a 1024-cubed lift."
