# MOSS-TTS: one spoken line from text, cloned from a 5–15 s reference clip
# (`forge gen speech`), and MOSS-VoiceGenerator, which designs that clip from
# a description (`forge gen voice`) so a project never has to bring a voice it
# does not own.
#
# Both run **on the ComfyUI host** through the TTS-Audio-Suite pack (MIT):
# no clone, no `.env`, no `trust_remote_code` in a venv of ours. Two tracked
# graphs, `workflows/speech.api.json` and `workflows/voice.api.json`; the
# weights the pack downloads land in the host's own base directory,
# `$PREFIX/data/models/TTS/moss_tts/` — measured there 2026-08-30, and not
# in the HF cache these rows used to claim.
#
# **The model the pack offers is not the one the venv ran.** Its MOSS-TTS
# variants at this pin are `1.7B` (OpenMOSS-Team/MOSS-TTS-Local-Transformer),
# the 8B Delay checkpoints, and community fine-tunes of those — captured from
# GET /object_info and the pack's own model_specs.py on 2026-08-30. The 8B
# Delay model is the one this repository measured OOM-ing on 24 GB with the
# audio tokenizer loaded (designs/hosting.md, "MOSS-TTS"), so `speech.api.json`
# states `1.7B`, and a line spoken through it is **a different voice from one
# spoken through the 4B the venv ran**. Nothing under assets/ is rewritten for
# that — the shipped lines' records say what made them — but a voice re-cloned
# after this move will not match one cloned before it, and that is a fact for
# the record and for the ear, not a detail.
#
# The voice designer is unchanged: the pack's "Voice Design 1.7B" is
# OpenMOSS-Team/MOSS-VoiceGenerator, the same weights `forge gen voice`
# already recorded.

name = "moss_tts"
role = "speech"
executor = "comfy"
host = "comfy"
upstream = "https://github.com/diodiogod/TTS-Audio-Suite"
commit = "fab00263fbdcdaddd4c721d1b560e1a08b6025ea"   # the pack, v5.8.7, 2026-08-28
license = "Apache-2.0 (MOSS-TTS and MOSS-VoiceGenerator weights); TTS-Audio-Suite: MIT; ComfyUI: GPL-3.0-or-later"
# Measured, and the budget sits above it: a spoken line peaked at 7.1 GB
# **with the voice designer's 5.4 GB already resident**, because the pack
# unloads neither — the designer and the cloner co-reside, so the budget is
# what both cost together (nvidia-smi at 10 Hz, 2026-08-30;
# designs/hosting.md, "the first real run of the audio path"). A budget is
# correct only when it is conservative, and 12 was under the pair.
vram_gb = 13
entry = "audio.speech"

[comfy]
workflows = ["speech.api.json", "voice.api.json"]
# Captured from the running host's GET /object_info on 2026-08-30.
nodes = [
    "MossTTSEngineNode",
    "UnifiedTTSTextNode",
    "UnifiedVoiceDesignerNode",
    "CharacterVoicesNode",
    "LoadAudio",
    "SaveAudio",
]
# No `unload_node`: the pack registers no unload class at this pin, and
# `POST /free` does not unload what it loaded — 5.4 GB stayed after a
# `voice` and 7.3 GB after a `speech` (2026-08-30). The lever is
# `systemctl --user restart forge-comfy`, 4.4 s, which is step 4 of
# `forge_serve`'s ladder.

[[comfy.packs]]
repo = "https://github.com/diodiogod/TTS-Audio-Suite"
commit = "fab00263fbdcdaddd4c721d1b560e1a08b6025ea"
dir = "TTS-Audio-Suite"
license = "MIT"
# The same list backends/moss_sfx/backend.toml carries and for the same
# reason: it is one pack in one venv, and MOSS-SoundEffect v2 is what needs
# these. `forge gen voice` ran without any of them on 2026-08-30; they are
# named here so the pack's four places say one thing.
pips = [
    "diffusers", "ftfy",
    "descript-audiotools",   # --no-deps
    "flatten-dict", "julius", "soundfile", "ffmpy", "importlib-resources",
    "tensorboard", "randomname",
]
nodes = ["MossTTSEngineNode", "UnifiedTTSTextNode", "UnifiedVoiceDesignerNode", "CharacterVoicesNode"]

# NOT `store = "hf"`: TTS-Audio-Suite downloads all three into the host's
# own base directory, `$PREFIX/data/models/TTS/moss_tts/`, and never into
# the hub cache. While these rows said `hf`, doctor looked in
# ~/.cache/huggingface and read `partial` on a machine where the voice
# designer had just spoken (2026-08-30). Each `gb` is what the directory
# measures on this host, dated — not a figure copied off a model card.
[[models]]
id = "OpenMOSS-Team/MOSS-TTS-Local-Transformer"
store = "comfy:models/TTS/moss_tts"
local = "MOSS-TTS-Local-Transformer"
license = "Apache-2.0"
gb = 5.72
note = "the pack's \"1.7B\" variant, two safetensors shards at 24 kHz; 5.72 GB on disk, measured 2026-08-30. NOT MOSS-TTS-Local-Transformer-v1.5, which the venv ran and the pack does not offer. It does not run under the host's transformers 5 — see the notice below."

[[models]]
id = "OpenMOSS-Team/MOSS-VoiceGenerator"
store = "comfy:models/TTS/moss_tts"
local = "MOSS-VoiceGenerator"
license = "Apache-2.0"
gb = 3.95
note = "3.95 GB on disk, measured 2026-08-30; the pack's \"Voice Design 1.7B\" — the same weights `forge gen voice` recorded before the move, and the one MOSS-TTS path that works at this pin"

[[models]]
id = "OpenMOSS-Team/MOSS-Audio-Tokenizer"
store = "comfy:models/TTS/moss_tts"
local = "MOSS-Audio-Tokenizer"
license = "Apache-2.0"
gb = 6.61
note = "6.61 GB on disk, measured 2026-08-30. The codec both the designer and the cloner encode and decode through; the pack fetches it beside them and no row named it until doctor was pointed at the directory they actually live in"

[[notices]]
title = "speech does not work at this pin"
text = "MOSS-TTS 1.7B does not run under the host's transformers 5.16.1, and the pack turns that into silence rather than an error: `MossTTSDelayModel` has no `_get_initial_cache_position` (the pack vendors transformers 4.x's `_sample`, and 5.x removed that helper), the node catches its own AttributeError, returns a silent tensor and lets the graph complete. Measured 2026-08-30 — the record written for that run described 1.000 s of digital zeros. Shimming it reaches a second break, `create_causal_mask() got an unexpected keyword argument 'input_embeds'` (renamed `inputs_embeds`, `cache_position` dropped), and shimming that one produces 12.8 s of babble for a four-word line, which is a model on wrong arithmetic and not a fix; both shims were reverted and the clone is back at fab00263. WHAT LIFTS THIS: a TTS-Audio-Suite pin built against transformers >= 5 (the host is at 5.16.1 because ComfyUI v0.34.2's requirements.txt asks for an unpinned `transformers>=4.50.3` and that is what resolved; the image templates that used to need 5.x have left, so nothing in the toolkit demands 5 any more, but pinning the whole host down to 4.x to suit one pack is a host-wide change nobody has weighed). Until then `forge gen speech` cannot make a line here, and doctor reads this backend `ok` because it probes node classes and weight files, neither of which is affected — that is what this notice is for. `forge gen voice` and MOSS-VoiceGenerator are unaffected and work."

[[notices]]
title = "the model changed"
text = "MOSS-TTS-Local-Transformer-v1.5 (what the venv ran) is not one of the variants TTS-Audio-Suite offers at fab00263; speech now runs the pack's 1.7B, OpenMOSS-Team/MOSS-TTS-Local-Transformer. A voice cloned after this move does not match one cloned before it. Re-audition a character's lines before shipping them beside older ones."

[[notices]]
title = "ffmpeg"
text = "ComfyUI v0.34.2 has no WAV save node, so `forge gen speech` and `forge gen voice` fetch the FLAC the graph saved and transcode it to 16-bit PCM before anything measures it. ffmpeg is required where the old venv path wrote the WAV itself with soundfile."
