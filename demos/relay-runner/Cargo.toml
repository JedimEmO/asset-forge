[workspace]
resolver = "3"
[package]
name = "relay-runner"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
bevy = { version = "=0.19.0", features = ["jpeg", "bevy_gltf", "tonemapping_luts", "wav", "flac", "mp3"] }
serde_json = "1"
bevy_hanabi = { version = "=0.19.0", default-features = false, features = ["3d"] }
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
[profile.dev.package.wgpu-types]
debug-assertions = true
[profile.dev.build-override]
debug = false

# Bevy systems declare each independent query/resource as a parameter.
[lints.clippy]
too_many_arguments = "allow"
