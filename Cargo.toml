[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/asset-forge"

[workspace.dependencies]
# tonemapping_luts is NOT a Bevy default feature, and without it the default
# TonyMcMapface tonemapper runs on a placeholder LUT and produces wrong colours
# with no warning. A capture crate whose whole job is faithful pixels cannot
# ship that. Bevy only enables vorbis by default and then UNWRAPS the rodio
# decoder, so a .wav panics a task pool with UnrecognizedFormat rather than
# failing gracefully; the viewer must be able to play what forge_audio measures.
bevy = { version = "=0.19.0", default-features = true, features = [
    "jpeg",
    "bevy_gltf",
    "tonemapping_luts",
    "wav",
    "flac",
    "mp3",
] }

forge_raster = { path = "crates/forge_raster", version = "0.1.0" }
forge_audio = { path = "crates/forge_audio", version = "0.1.0" }
forge_capture = { path = "crates/forge_capture", version = "0.1.0" }
forge_rig = { path = "crates/forge_rig", version = "0.1.0" }
forge_motion = { path = "crates/forge_motion", version = "0.1.0" }
forge_manifest = { path = "crates/forge_manifest", version = "0.1.0" }
forge_library = { path = "crates/forge_library", version = "0.1.0" }
forge_studio = { path = "crates/forge_studio", version = "0.1.0" }
forge_mcp = { path = "crates/forge_mcp", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
glam = "0.32"
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
zip = { version = "7", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
rustfft = "6"
clap = { version = "4", features = ["derive"] }
# rmcp's #[tool_router]/#[tool_handler] macros churn between minors; every rmcp
# type stays inside forge_mcp so a bump is one crate's problem.
rmcp = { version = "=1.8.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-std"] }
schemars = "1.0"
base64 = "0.22"
# std's mpsc Receiver is !Sync, so it cannot live in a Bevy Resource; this can.
crossbeam-channel = "0.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Bevy systems take many parameters by design, and f32 casts are pervasive in
# graphics code. Neither is a smell here.
too_many_arguments = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
# A CLI flag table is long without being complex, and splitting one across
# helpers to satisfy a line count makes it harder to read, not easier.
too_many_lines = "allow"
# Bevy systems must take Res/Query/Commands by value — the framework's whole
# parameter protocol is by-value, so this lint fires on nearly every system.
needless_pass_by_value = "allow"
# UI state legitimately has several independent flags (playing, looping,
# dirty, ready); bundling them into an enum would model them as exclusive.
struct_excessive_bools = "allow"
unwrap_used = "warn"

[profile.dev]
opt-level = 1

# Dependencies are not our code: build them fully optimized and WITHOUT debug
# info. The debug info is the part that matters for disk — Bevy + wgpu at
# opt-level 3 with debuginfo grows a target/ by hundreds of GB over weeks of
# rebuilds — and its only cost is that backtraces stop naming frames inside
# dependencies; workspace crates keep full debug info from [profile.dev].
[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false

# The one dependency whose debug assertions are diagnostics, not overhead:
# wgpu-types computes its default InstanceFlags from cfg(debug_assertions),
# and losing them silently turns off GPU validation and debug labels in every
# dev run. The crate is a leaf of type definitions; keeping its assertions
# costs nothing at runtime. (WGPU_VALIDATION=0 still overrides.)
[profile.dev.package.wgpu-types]
debug-assertions = true

# Build scripts and proc macros: same reasoning, nobody debugs serde derives.
[profile.dev.build-override]
debug = false

[profile.release]
lto = "thin"
